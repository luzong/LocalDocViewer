<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地文档浏览器</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 顶部工具栏 -->
    <header class="topbar">
        <div class="brand">
            <span class="logo">📚</span>
            <span class="title">本地文档浏览器</span>
        </div>
        <div class="search-wrap">
            <input id="searchInput" type="search" placeholder="搜索文件名…" autocomplete="off">
            <button id="searchClear" type="button" class="search-clear" title="清除搜索" aria-label="清除搜索">×</button>
        </div>
        <div class="tools">
            <div class="view-switch">
                <button id="viewGrid" class="active" title="网格视图">▦</button>
                <button id="viewList" title="列表视图">≡</button>
            </div>
            <button id="refreshBtn" class="icon-btn" title="重新加载数据">↻</button>
            <button id="rescanBtn" class="icon-btn" title="运行扫描器（生成新数据）">⚡</button>
        </div>
    </header>

    <main class="layout">
        <!-- 左侧多级菜单 -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>目录树</span>
                <div class="sidebar-ops">
                    <button id="expandAll" title="全部展开">⊕</button>
                    <button id="collapseAll" title="全部折叠">⊖</button>
                </div>
            </div>
            <div class="sidebar-search">
                <input id="folderFilter" type="search" placeholder="过滤目录…" autocomplete="off">
            </div>
            <nav id="treeView" class="tree-view">
                <!-- 树节点由 JS 渲染 -->
            </nav>
            <div class="sidebar-footer" id="sidebarFooter">
                <!-- 统计信息 -->
            </div>
        </aside>

        <!-- 中间卡片列表 -->
        <section class="content">
            <div class="breadcrumb" id="breadcrumb">
                <span class="crumb" data-folder-id="">全部</span>
            </div>
            <div class="toolbar">
                <div class="left">
                    <span id="folderInfo"></span>
                </div>
                <div class="right">
                    <span id="resultCount"></span>
                    <select id="extFilter" title="按文件类型筛选">
                        <option value="">全部类型</option>
                    </select>
                    <select id="sortSelect" title="排序方式">
                        <option value="name-asc">名称 ↑</option>
                        <option value="name-desc">名称 ↓</option>
                        <option value="size-asc">大小 ↑</option>
                        <option value="size-desc">大小 ↓</option>
                        <option value="ext-asc">类型 ↑</option>
                        <option value="ext-desc">类型 ↓</option>
                        <option value="natural">自然顺序</option>
                    </select>
                </div>
            </div>
            <div id="cardGrid" class="card-grid view-grid">
                <!-- 卡片由 JS 渲染 -->
            </div>
            <div id="emptyState" class="empty-state" style="display:none;">
                <div class="empty-icon">🗂️</div>
                <p>该目录下暂无可识别的文档</p>
                <p class="empty-hint">支持: pdf / doc / docx / txt / md / rtf</p>
            </div>
            <!-- 返回顶部浮动按钮 -->
            <button id="backToTop" class="back-to-top" title="返回顶部" aria-label="返回顶部">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
            </button>
        </section>
    </main>

    <!-- 预览弹窗 -->
    <div id="previewModal" class="modal" style="display:none;">
        <div class="modal-backdrop"></div>
        <div class="modal-box">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-content">
                <div class="modal-thumb" id="modalThumb">
                    <button class="gallery-nav prev" id="galleryPrev" title="上一张" style="display:none;">‹</button>
                    <img id="previewImg" alt="预览" title="双击放大">
                    <button class="gallery-nav next" id="galleryNext" title="下一张" style="display:none;">›</button>
                    <div class="gallery-counter" id="galleryCounter" style="display:none;">1 / 1</div>
                </div>
                <div class="modal-info">
                    <h2 id="previewTitle"></h2>
                    <div id="previewMeta" class="meta-list"></div>
                    <div class="modal-actions">
                        <button id="openInBrowserBtn" class="btn primary">在浏览器打开</button>
                        <button id="openFileBtn" class="btn">打开本地文件</button>
                        <button id="copyPathBtn" class="btn">复制文件路径</button>
                        <button id="openParentBtn" class="btn">打开文件位置</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 图片放大查看 (lightbox) -->
    <div id="imageLightbox" class="lightbox" style="display:none;">
        <div class="lightbox-backdrop"></div>
        <button class="lightbox-close" id="lightboxClose">×</button>
        <img id="lightboxImg" alt="放大查看">
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" style="display:none;"></div>

    <!-- 卡片操作菜单(右键) -->
    <div id="cardMenu" class="ctx-menu" style="display:none;">
        <button data-act="preview">🔍 预览</button>
        <button data-act="openInBrowser">🌐 在浏览器打开</button>
        <button data-act="open">📂 打开本地文件</button>
        <button data-act="copyPath">📋 复制文件路径</button>
        <button data-act="tryOpenDir">📁 打开文件位置</button>
    </div>

    <!-- 数据加载中遮罩 -->
    <div id="loadingMask" class="loading-mask">
        <div class="spinner"></div>
        <p id="loadingText">正在加载数据…</p>
    </div>

    <!-- 错误/空数据提示 -->
    <div id="firstRunTip" class="first-run-tip" style="display:none;">
        <div class="fr-box">
            <h1>👋 欢迎使用本地文档浏览器</h1>
            <p>检测到尚未扫描任何文档目录.</p>
            <ol>
                <li>双击运行 <code>scanner/dist/DocumentScanner.exe</code></li>
                <li>在弹窗中选择你的文档主目录</li>
                <li>等待扫描完成后, 本页面会自动刷新</li>
            </ol>
            <p class="fr-tip">如需手动指定, 可在命令行执行:<br>
                <code>DocumentScanner.exe --root "D:\我的文档" --out "网站目录"</code>
            </p>
            <button id="retryLoadBtn" class="btn primary">重新加载页面</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
